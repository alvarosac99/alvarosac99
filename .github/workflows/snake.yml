name: Generar serpiente

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ea580c&color_dots=#ebedf0,#fed7aa,#fb923c,#ea580c,#7c2d12
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#fbbf24&color_dots=#2a1810,#7c2d12,#c2410c,#f97316,#fbbf24

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          author: Álvaro Sebastián Acosta Cortizas <145587906+alvarosac99@users.noreply.github.com>
          committer: Álvaro Sebastián Acosta Cortizas <145587906+alvarosac99@users.noreply.github.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
